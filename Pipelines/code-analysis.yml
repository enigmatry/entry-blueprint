trigger: none

schedules:
- cron: '0 0 * * *'
  displayName: Daily midnight build
  branches:
    include:
    - master
    - main
  always: false

variables:
  - template: variables/variables.node.yml
  - name: artifactName
    value: 'enigmatry-entry-blueprint'
  - name: projectNameAngularApp
    value: enigmatry-entry-blueprint-app
  - name: projectNamePrefix
    value: Enigmatry.Entry.Blueprint

resources:
  repositories:
    - repository: templates
      type: git
      name: Enigmatry - Azure Pipelines Templates/enigmatry-azure-pipelines-templates

jobs:
- template: code-analysis.yml@templates
  parameters:
    projectName: 'Entry Blueprint'
    sonarProjectKey: 'AspNetCoreAngular_EnigmatryEntryBlueprint'
    displayName: 'Code Analysis'
    dotNetVersion: '10.0.x'
    projectNameAngularApp: $(projectNameAngularApp)
    nodeVersion: $(nodeVersion)
    useSlnx: true

- template: build-report-job.yml@templates
  parameters:
    artifactName: $(artifactName)
    displayName: 'Generate Reports'
    projectNameAngularApp: $(projectNameAngularApp)
    projectNamePrefix: $(projectNamePrefix)
    useSlnx: true